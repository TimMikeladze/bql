# fly.toml: one machine, one volume, a single-node bus. For more than one node see
# `bql bus serve --cluster` in docs/operations.md.
app = "bql-bus-demo"
primary_region = "sjc"

# Deploy from the repository root: `fly deploy . --config packages/bus/fly.toml`. The image
# builds bql.sh's libsqlite3 from packages/db, so packages/bus alone is not enough context.
[build]
  dockerfile = "Dockerfile"
  ignorefile = "Dockerfile.dockerignore"

[env]
  PORT = "4317"
  BUS_DATA = "/data"
  BUS_HOST = "0.0.0.0"
  BUS_LOG_FORMAT = "json"
  BUS_LOG_LEVEL = "info"

# BUS_SIGNING_KEY and BUS_ADMIN_TOKEN are secrets, never [env]:
#   fly secrets set BUS_SIGNING_KEY=$(openssl rand -base64 32) \
#                   BUS_ADMIN_TOKEN=$(openssl rand -base64 32)
# Without them the bus generates both into /data/bus at mode 0600 on first
# boot, which works and persists, but then the only way to read the admin token
# is to shell into the machine, so set them.
#
# Continuous backup of database `bus` to a bucket is bql.sh's S3 shipping, also
# secrets:
#   fly secrets set BQL_S3_URL=s3://bucket/bus BQL_S3_ENDPOINT=https://… \
#                   BQL_S3_ACCESS_KEY_ID=… BQL_S3_SECRET_ACCESS_KEY=…

[[mounts]]
  source = "bql_bus_data"
  destination = "/data"
  # Volume snapshots, beside S3 shipping. See docs/operations.md.
  snapshot_retention = 5

[deploy]
  # One machine on one volume cannot run two copies, so this is stop-then-start
  # with a short outage. Two processes on one data directory is the one thing
  # the design rules out.
  strategy = "immediate"

[http_service]
  internal_port = 4317
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Liveness only. `/ready` additionally requires that a consumer has checked
  # in recently, which is a real signal but the wrong one for a platform health
  # check: a freshly deployed bus with no consumers yet is healthy, not broken.
  # Poll /ready from your own monitoring, where "nobody is consuming" is the
  # alert you actually want.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
