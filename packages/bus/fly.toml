# fly.toml — one machine, one volume. bql.sh/bus is single-writer by design.
app = "bql-bus-demo"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4317"
  BUS_STATE = "/data"
  BUS_HOST = "0.0.0.0"
  BUS_LOG_FORMAT = "json"
  BUS_LOG_LEVEL = "info"

# BUS_SIGNING_KEY and BUS_ADMIN_TOKEN are secrets, never [env]:
#   fly secrets set BUS_SIGNING_KEY=$(openssl rand -base64 32) \
#                   BUS_ADMIN_TOKEN=$(openssl rand -base64 32)
# Without them the bus generates both into /data at mode 0600 on first boot,
# which works and persists — but then the only way to read the admin token is
# to shell into the machine, so set them.

[[mounts]]
  source = "bql_bus_data"
  destination = "/data"
  # A single SQLite file with no replication has exactly one backup story
  # beyond `bql bus backup`: volume snapshots. See docs/operations.md.
  snapshot_retention = 5

[deploy]
  # One machine on one volume cannot run two copies, so this is stop-then-start
  # with a short outage — which is correct here. The alternative would put two
  # processes on one SQLite file, the one thing the design rules out.
  strategy = "immediate"

[http_service]
  internal_port = 4317
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Liveness only. `/ready` additionally requires that a consumer has checked
  # in recently, which is a real signal but the wrong one for a platform health
  # check: a freshly deployed bus with no consumers yet is healthy, not broken.
  # Poll /ready from your own monitoring, where "nobody is consuming" is the
  # alert you actually want.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
