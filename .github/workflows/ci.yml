# Invariant: this workflow proves that bql.sh builds the libsqlite3 it needs from a pinned source,
# that both halves type-check, and that both suites pass. Nothing here needs a secret, and nothing
# here reaches a network service the tests do not start themselves: the storage tests use the
# in-process FakeS3 unless BQL_TEST_S3_ENDPOINT names a real bucket, and this workflow never sets it.
#
# A second leg, added by L7: the `tarball` job proves the published *package* can build its own
# engine, which the first cannot — it runs against the working tree, where files the tarball omits
# are still present.
#
# **Linux only.** macOS and Windows legs ran here until 2026-09-26 and both were green; they were
# removed for cost and wall-clock, not because they stopped passing. What that gives up is written
# down rather than forgotten: macOS was the arm64 half of the matrix, and Windows was a gate earned
# over three exploratory runs (`packages/db/docs/e1-windows.md`, `e2-windows-gate.md`) whose
# findings — POSIX assumptions in tests, a clock that needs four times the timeout — are still in
# the code that fixed them. Both are a `runs-on` line away if a release ever needs the evidence
# again, and `packages/db/docs/c6-packaging.md` §1 keeps the platform notes.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # package.json `engines` asks for >=1.4.0; CI pins an exact one so a Bun release cannot
          # turn a green branch red on its own.
          bun-version: 1.4.2

      # packages/db/scripts/sqlite.ts holds the pinned SQLite version and the flag list, and
      # packages/db/scripts/native/walsum.c is compiled into the same artefact, so the two hashed
      # together are exactly its identity. Change either and the cache misses, as it should. (The
      # stamp beside the artefact hashes both as well, so a stale cache would be rebuilt rather
      # than trusted — this key is what stops that from happening on every run.)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/db/vendor/sqlite
          key: sqlite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/db/scripts/sqlite.ts', 'packages/db/scripts/native/walsum.c') }}

      - run: bun install --frozen-lockfile

      - name: build libsqlite3
        run: bun run db sqlite:build

      - name: report the library under test
        working-directory: packages/db
        run: bun -e 'const{sqlite}=await import("./src/sqlite/lib.ts");const l=sqlite();console.log(l.path,l.version,JSON.stringify(l.features))'

      # A raw control byte in source is invisible to git past its 8000-byte binary sniff, so a
      # byte scan is the only thing that finds one. It walks `git ls-files`, so one run at the
      # root covers both packages. See scripts/bytes.ts.
      - run: bun run bytes

      - run: bun run typecheck

      - name: "bql.sh"
        run: bun run db test

      - name: "bql.sh/bus"
        run: bun run bus test

      - name: docs/api.md covers every route
        run: bun run db routes:check

  # L7's gate. Every other leg above runs against the *working tree*, which has files the published
  # package does not — and that is exactly how `sqlite:build` came to be advertised in
  # `package.json` and in the README while being absent from the tarball: a clone with a locally
  # built `vendor/` hides it completely. This job packs the real tarball, installs it into an empty
  # directory as a dependency, builds SQLite from there and runs a smoke test on what it built.
  #
  # Not a clone, not a workspace link, and not in the job above: it rebuilds SQLite from source in
  # a directory the cache there does not cover, which is the point — a cached artefact would be the
  # working tree's, and the thing under test is whether the *package* can build one.
  pack:
    name: tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: pack, install, build the engine, smoke it
        run: bun run pack:check
