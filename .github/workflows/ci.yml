# Invariant: every leg of this workflow proves the same thing on all three platforms — that
# bql.sh builds the libsqlite3 it needs from a pinned source, that both packages type-check,
# and that both suites pass. Nothing here needs a secret, and nothing here reaches a network
# service the tests do not start themselves: the storage tests use the in-process FakeS3 unless
# BQL_TEST_S3_ENDPOINT names a real bucket, and this workflow never sets it.
#
# A fourth leg, added by L7: the `tarball` job proves the published *package* can build its own
# engine, which nothing above can — every other job runs against the working tree, where files the
# tarball omits are still present.
#
# Two packages, one pipeline. bql.sh/bus arrived with the monorepo (docs/monorepo.md) and had
# never run in CI before, so it is on macOS and Ubuntu and **not** on the Windows gate. That gate
# was earned over three exploratory runs for bql.sh (packages/db/docs/e2-windows-gate.md);
# putting an unproven suite behind it on day one would mean either a red main branch or a
# `continue-on-error` that makes the gate meaningless for the package that did earn it.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64, ubuntu-latest is x64, so between them the matrix covers both
        # architectures as well as both platforms.
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # package.json `engines` asks for >=1.4.0; CI pins an exact one so a Bun release cannot
          # turn a green branch red on its own.
          bun-version: 1.4.2

      # packages/db/scripts/sqlite.ts holds the pinned SQLite version and the flag list, and
      # packages/db/scripts/native/walsum.c is compiled into the same artefact, so the two hashed
      # together are exactly its identity. Change either and the cache misses, as it should. (The
      # stamp beside the artefact hashes both as well, so a stale cache would be rebuilt rather
      # than trusted — this key is what stops that from happening on every run.)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/db/vendor/sqlite
          key: sqlite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/db/scripts/sqlite.ts', 'packages/db/scripts/native/walsum.c') }}

      - run: bun install --frozen-lockfile

      - name: build libsqlite3
        run: bun run db sqlite:build

      - name: report the library under test
        working-directory: packages/db
        run: bun -e 'const{sqlite}=await import("./src/sqlite/lib.ts");const l=sqlite();console.log(l.path,l.version,JSON.stringify(l.features))'

      # A raw control byte in source is invisible to git past its 8000-byte binary sniff, so a
      # byte scan is the only thing that finds one. It walks `git ls-files`, so one run at the
      # root covers both packages. See scripts/bytes.ts.
      - run: bun run bytes

      - run: bun run typecheck

      - name: "bql.sh"
        run: bun run db test

      - name: "bql.sh/bus"
        run: bun run bus test

      - name: docs/api.md covers every route
        run: bun run db routes:check

  # L7's gate. Every other leg above runs against the *working tree*, which has files the published
  # package does not — and that is exactly how `sqlite:build` came to be advertised in
  # `package.json` and in the README while being absent from the tarball: a clone with a locally
  # built `vendor/` hides it completely. This job packs the real tarball, installs it into an empty
  # directory as a dependency, builds SQLite from there and runs a smoke test on what it built.
  #
  # Not a clone, not a workspace link, and not in the matrix above: it rebuilds SQLite from source
  # in a directory the cache above does not cover, which is the point — a cached artefact would be
  # the working tree's, and the thing under test is whether the *package* can build one.
  #
  # macOS and Linux only. `packages/db/docs/c6-packaging.md` §1 has the platform evidence, and the
  # Windows gate is already the longest job here.
  pack:
    name: tarball (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: pack, install, build the engine, smoke it
        run: bun run pack:check

  # Windows is a gate as of E2 (`packages/db/docs/e2-windows-gate.md`). It was exploratory for
  # three runs and `continue-on-error` at every level while it answered the question E1 asked; the
  # answer was 1346 of 1498, then one fix took it to 1479, then five POSIX assumptions in tests
  # and one that was merely slow took it to the whole suite. The `continue-on-error` lines are
  # gone, which is what E1 §2 said would happen on the day it passed.
  #
  # It keeps its own job rather than joining the matrix because it needs 30 minutes where the
  # other two need 25: creating a file and opening SQLite on it are both far dearer there, and the
  # suite runs about three times as long as a result.
  #
  # bql.sh only. The bus has its own Windows question to answer, with its own evidence.
  windows:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/db/vendor/sqlite
          key: sqlite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/db/scripts/sqlite.ts', 'packages/db/scripts/native/walsum.c') }}

      - run: bun install --frozen-lockfile

      - name: build libsqlite3
        run: bun run db sqlite:build

      - name: report the library under test
        working-directory: packages/db
        run: bun -e 'const{sqlite}=await import("./src/sqlite/lib.ts");const l=sqlite();console.log(l.path,l.version,JSON.stringify(l.features))'

      - run: bun run bytes

      - name: typecheck bql.sh
        run: bun run db typecheck

      # `--timeout 20000` rather than bun's default 5000, and it is scaling the clock rather than
      # the assertions. Creating a file and opening SQLite on it are both several times dearer on
      # Windows: sibling tests in the two files that timed out here take 3.6 s and 0.95 s on the
      # same runner, so 5 s is a limit the platform crosses doing legitimate work. A hang still
      # fails, four times slower than it would elsewhere.
      - name: "bql.sh"
        working-directory: packages/db
        run: bun test --timeout 20000

      - name: docs/api.md covers every route
        run: bun run db routes:check
