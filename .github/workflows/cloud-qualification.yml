name: cloud storage qualification (billable opt-in)

on:
  workflow_dispatch:
    inputs:
      provider:
        type: choice
        options: [r2, blob]
        required: true
        description: Isolated storage provider to exercise
      confirmation:
        type: string
        required: true
        description: Type BILLABLE to authorize requests and retained test objects

permissions:
  contents: read

jobs:
  qualify:
    if: inputs.confirmation == 'BILLABLE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloud-qualification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run db sqlite:build
      - run: bun install --cwd deploy/vercel --frozen-lockfile
      - name: storage contract and measured recovery
        env:
          BQL_BILLABLE_TESTS: '1'
          BQL_RECOVERY_TESTS: '1'
          BQL_TEST_PREFIX: bql-qualification/
          VERCEL_BLOB_RETRIES: '0'
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BQL_TEST_BLOB_TOKEN }}
          S3_BUCKET: ${{ secrets.BQL_TEST_R2_BUCKET }}
          S3_ENDPOINT: ${{ secrets.BQL_TEST_R2_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.BQL_TEST_R2_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.BQL_TEST_R2_SECRET_ACCESS_KEY }}
          S3_REGION: auto
          PROVIDER: ${{ inputs.provider }}
        run: |
          if [ "$PROVIDER" = "r2" ]; then
            bun run --cwd deploy/cloudflare storage:smoke
          else
            bun run --cwd deploy/vercel storage:smoke
          fi
          bun packages/db/bench/cloud.ts --provider "$PROVIDER" > cloud-measurements.json
          cat cloud-measurements.json
