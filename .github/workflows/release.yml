# Publishing, on a tag and only on a tag.
#
# Invariant: nothing reaches npm that has not passed the same gate `ci.yml` runs, on the same
# pinned Bun and against a libsqlite3 built here from the pinned source. The publish step is the
# last one, and every check is a hard failure — this workflow has no `continue-on-error` anywhere,
# deliberately, because a half-verified package is worse than no package.
#
# Two packages version independently, so the tag says which one:
#
#   db-v1.2.3   publishes packages/db  as @bunql/db
#   bus-v0.1.0  publishes packages/bus as @bunql/bus
#
# How a release happens:
#
#   1. Set `version` in that package's package.json to the version being released.
#   2. `git tag <prefix>-v<that version> && git push --tags`.
#
# The tag is the trigger and the tag must match the package's `package.json`; `verify the tag`
# below refuses the release otherwise, so a tag pushed against the wrong commit cannot publish a
# version that claims to be something else. `GET /v1/openapi.json` publishes `info.version` from
# the same field for @bunql/db and `packages/db/test/package/exports.test.ts` holds the two
# together, so the tag, the package and every generated client agree by construction.
#
# Both packages are scoped to an npm org this project owns. Unscoped `bunql` is somebody else's (a
# query builder, last published 2026-02-12 with a `github.com/yourusername/` placeholder for a
# repository), and the scope is wanted for its own sake: `packages/db/docs/c6-packaging.md` §6
# plans `@bunql/sqlite-darwin-arm64` and friends, which need it.
#
# The products are still called BunQL and AgenticBus. `BUNQL_*`, `bunql.toml`, the `bunql:` log
# prefix, the `bunql` and `agenticbus` binaries are all unchanged — only the names they are
# *published* under are scoped.
#
# **One thing is still needed before the first tag**, and it is not a code change: `NPM_TOKEN`, an
# automation token for the org, in this repository's secrets. The `id-token: write` permission
# below is what lets npm attach a provenance attestation, which is why the publish does not need
# `--access` spelled out beyond `publishConfig`.

name: release

on:
  push:
    tags: ["db-v*", "bus-v*"]

permissions:
  contents: read
  # npm provenance: the attestation is signed with this workflow's OIDC identity.
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # npm itself does the publishing: `bun publish` does not yet emit provenance, and provenance
      # is the point of publishing from CI rather than from a laptop.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The tag names the package. Anything else never reaches the publish step, because `on.tags`
      # above only matches these two prefixes — this is the second half of the same decision, and
      # it is what turns the prefix into a directory.
      - name: resolve the package from the tag
        id: pkg
        run: |
          case "$GITHUB_REF_NAME" in
            db-v*)  dir=packages/db ;;
            bus-v*) dir=packages/bus ;;
            *) echo "tag $GITHUB_REF_NAME names no package" >&2; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "publishing from $dir"

      - name: verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#*-v}"
          pkg=$(bun -e 'console.log(JSON.parse(await Bun.file("${{ steps.pkg.outputs.dir }}/package.json").text()).version)')
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, ${{ steps.pkg.outputs.dir }}/package.json says $pkg" >&2
            exit 1
          fi
          echo "releasing $pkg"

      - run: bun install --frozen-lockfile

      # Both packages run the whole gate, not just the one being released. @bunql/bus does not
      # depend on @bunql/db yet, but it is about to, and a release that only proved its own half
      # would be the release that ships the skew.
      - name: build libsqlite3
        run: bun run db sqlite:build

      - name: report the library under test
        working-directory: packages/db
        run: bun -e 'const{sqlite}=await import("./src/sqlite/lib.ts");const l=sqlite();console.log(l.path,l.version,JSON.stringify(l.features))'

      - run: bun run bytes

      - run: bun run typecheck

      - name: "@bunql/db"
        run: bun run db test

      - name: "@bunql/bus"
        run: bun run bus test

      - name: docs/api.md covers every route
        run: bun run db routes:check

      # `--dry-run` first, so a packing failure — a missing file, a name npm will not accept — is
      # reported before anything is uploaded rather than halfway through.
      - name: pack
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --dry-run --provenance

      - name: publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
